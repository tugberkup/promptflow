[package]
name = "promptflow"
version = "2.0.0"
description = "Stop typing your prompts, say them. Local push-to-talk dictation."
authors = ["Tuğberk Özdoğan"]
license = "MIT"
repository = "https://github.com/tugberkup/promptflow"
edition = "2021"

[lib]
name = "promptflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
