[package]
name = "promptflow"
version = "2.0.0"
description = "Stop typing your prompts, say them. Local push-to-talk dictation."
authors = ["Tuğberk Özdoğan"]
license = "MIT"
repository = "https://github.com/tugberkup/promptflow"
edition = "2021"

[lib]
name = "promptflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
handy-keys = "0.3.4"
enigo = "0.6.1"
arboard = "3.7.0"
anyhow = "1.0.104"
ureq = { version = "3.5.0", features = ["json"] }
regex = "1.13.1"
opener = "0.9.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
sha2 = "0.10"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }

[target."cfg(windows)".dependencies]
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
