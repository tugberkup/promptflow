[package]
name = "promptflow"
version = "2.0.0"
description = "Stop typing your prompts, say them. Local push-to-talk dictation."
authors = ["Tuğberk Özdoğan"]
license = "MIT"
repository = "https://github.com/tugberkup/promptflow"
edition = "2021"

[lib]
name = "promptflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
handy-keys = "0.3.4"
enigo = "0.6.1"
arboard = "3.7.0"
anyhow = "1.0.104"
ureq = { version = "3.5.0", features = ["json"] }
regex = "1.13.1"
opener = "0.9.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
sha2 = "0.10"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
sys-locale = "0.3.2"
# API keys for the cloud providers, in Windows Credential Manager / the macOS Keychain
keyring = "4.2"

[target."cfg(windows)".dependencies]
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Diagnostics_Debug", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices", "Win32_Globalization"] }

# Apple Silicon runs Whisper on the GPU with Metal; Intel Macs use the CPU (Metal hangs on some of their AMD GPUs)
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

# Parakeet (NVIDIA) through ONNX Runtime: fast on the CPU in 25 European languages. ONNX Runtime has
# no prebuilt binaries for Intel Macs, so they only get Whisper.
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
transcribe-rs = { version = "0.3.12", default-features = false, features = ["onnx"] }
# ort 2.0.0-rc.13+ changed its API under transcribe-rs 0.3.12; pin what transcribe-rs was released with
ort = { version = "=2.0.0-rc.12", default-features = false }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
whisper-rs = { version = "0.16.0" }
