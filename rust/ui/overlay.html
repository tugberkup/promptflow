<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PromptFlow overlay</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    canvas { display: block; width: 210px; height: 44px; }
  </style>
</head>
<body>
  <canvas id="pill" width="420" height="88"></canvas>
  <script>
    // The recording pill at the bottom of the screen. It never takes focus and lets clicks through;
    // it only draws while there's something to show.
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const canvas = document.getElementById("pill");
    const c = canvas.getContext("2d");
    c.scale(2, 2); // drawn at 2x for sharp edges on high-DPI screens
    const W = 210, H = 44, CY = H / 2;
    const FONT = '600 13px "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';

    let mode = null, phase = 0, level = 0, smooth = 0, hideTimer = null;

    function show(next) {
      mode = next;
      clearTimeout(hideTimer);
      if (next === "done" || next === "error") hideTimer = setTimeout(() => (mode = null), 1000);
    }

    function pill() {
      c.fillStyle = "rgba(28, 28, 33, 0.96)";
      c.beginPath();
      c.roundRect(0.5, 0.5, W - 1, H - 1, CY);
      c.fill();
    }

    function draw() {
      c.clearRect(0, 0, W, H);
      phase++;
      if (!mode) return;
      pill();
      c.font = FONT;
      c.textBaseline = "middle";
      if (mode === "recording") {
        smooth = 0.6 * smooth + 0.4 * Math.min(1, Math.pow(level / 0.08, 0.7));
        const r = 4 + 1.5 * Math.sin(phase * 0.25);
        c.fillStyle = "#E5484D";
        c.beginPath(); c.arc(22, CY, r, 0, 2 * Math.PI); c.fill();
        c.fillStyle = "white";
        c.fillText("Listening", 36, CY);
        for (let i = 0; i < 5; i++) {
          const bar = 3 + 15 * smooth * (0.55 + 0.45 * Math.sin(phase * 0.5 + i * 1.3));
          c.fillStyle = "#E5484D";
          c.fillRect(140 + i * 10, CY - bar, 5, bar * 2);
        }
      } else if (mode === "processing") {
        c.fillStyle = "white";
        c.fillText("Transcribing", 22, CY);
        for (let i = 0; i < 3; i++) {
          const r = 2.5 + 1.5 * Math.max(0, Math.sin(phase * 0.3 - i * 0.9));
          c.fillStyle = "#E08A1E";
          c.beginPath(); c.arc(160 + i * 12, CY, r, 0, 2 * Math.PI); c.fill();
        }
      } else {
        c.textAlign = "center";
        c.fillStyle = mode === "done" ? "#4ADE80" : "#F87171";
        c.fillText(mode === "done" ? "✓  Pasted" : "!  Something went wrong", W / 2, CY);
        c.textAlign = "left";
      }
    }

    setInterval(draw, 40);
    setInterval(async () => {
      if (mode === "recording") level = await invoke("get_level");
    }, 50);

    listen("engine", ({ payload: { kind } }) => {
      if (kind === "recording" || kind === "processing" || kind === "done" || kind === "error") show(kind);
      else if (kind === "idle") show(null);
    });
  </script>
</body>
</html>
