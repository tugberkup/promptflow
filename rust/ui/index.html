<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromptFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img class="logo" src="icon.png" alt="">
    <div class="titles">
      <h1>PromptFlow</h1>
      <p id="hint"></p>
    </div>
    <span id="status" class="status loading"></span>
  </header>

  <section id="permissions" class="banner" hidden>
    <p id="permissions-text"></p>
    <button id="permissions-open"></button>
  </section>

  <section class="card settings">
    <label data-i18n="settings.mode"></label>
    <div class="segmented" id="mode">
      <button data-value="clean" data-i18n="mode.clean"></button>
      <button data-value="prompt" data-i18n="mode.prompt"></button>
      <button data-value="raw" data-i18n="mode.raw"></button>
    </div>
    <span></span><p class="sub" id="mode-hint"></p>

    <label for="ai-model" data-i18n="settings.ai_model"></label>
    <select id="ai-model"></select>

    <label for="speech-model" data-i18n="settings.speech_model"></label>
    <button id="speech-model" class="picker"><span id="speech-model-name"></span><em data-i18n="settings.change"></em></button>

    <label for="hotkey" data-i18n="settings.hotkey"></label>
    <select id="hotkey"></select>

    <label for="mic" data-i18n="settings.microphone"></label>
    <select id="mic"></select>

    <label for="language" data-i18n="settings.dictation_language"></label>
    <select id="language"></select>

    <label for="ui-language" data-i18n="settings.interface_language"></label>
    <select id="ui-language"></select>

    <div class="switches">
      <label class="switch"><input type="checkbox" id="autostart"><span></span><em id="autostart-label"></em></label>
      <label class="switch"><input type="checkbox" id="sounds"><span></span><em data-i18n="settings.beeps"></em></label>
    </div>
  </section>

  <section class="card history">
    <div class="history-top">
      <h2 data-i18n="history.title"></h2>
      <button class="ghost" id="open-history" data-i18n="history.full"></button>
    </div>
    <div id="history-list"></div>
  </section>

  <footer>
    <button class="secondary" id="edit-dictionary" data-i18n="footer.dictionary"></button>
    <button class="primary" id="hide"></button>
  </footer>

  <section id="catalog" class="sheet" hidden>
    <div class="sheet-head">
      <h2 data-i18n="catalog.title"></h2>
      <button id="catalog-close" class="close" data-i18n-title="catalog.close">✕</button>
    </div>
    <p id="catalog-hw" class="sub"></p>
    <div class="languages">
      <strong data-i18n="catalog.languages"></strong>
      <div id="language-chips" class="chips"></div>
      <p class="sub" data-i18n="catalog.languages_hint"></p>
    </div>
    <p id="catalog-reason"></p>
    <div id="catalog-list"></div>
    <div id="ai-box" class="ai-box"></div>
  </section>

  <script src="i18n.js"></script>
  <script src="locales/en.js"></script>
  <script src="locales/es.js"></script>
  <script src="locales/pt.js"></script>
  <script src="locales/fr.js"></script>
  <script src="locales/de.js"></script>
  <script src="locales/it.js"></script>
  <script src="locales/nl.js"></script>
  <script src="locales/pl.js"></script>
  <script src="locales/tr.js"></script>
  <script src="locales/ru.js"></script>
  <script src="locales/uk.js"></script>
  <script src="locales/ja.js"></script>
  <script src="locales/ko.js"></script>
  <script src="locales/zh.js"></script>
  <script src="locales/id.js"></script>
  <script src="locales/vi.js"></script>
  <script src="main.js"></script>
</body>
</html>
